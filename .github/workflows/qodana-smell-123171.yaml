# 123171 - Inês Fidalgo
name: Qodana Long Method - 123171

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest
    env:
      # Defina como "true" se quiser focar apenas nas alterações do Pull Request,
      # ou "false" para analisar o projeto completo.
      QODANA_PR_MODE: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-123171.yaml
          use-annotations: true
          # Coloque a true se quiser que a action comente automaticamente no Pull Request
          post-pr-comment: true