# 123171 - Inês Fidalgo
name: Qodana Code Analysis 123171

on:
  push:
    branches: [ "main", "develop", "teste-smell-123171" ]
  pull_request:
    branches: [ "main" ]

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2025.3
        with:
          args: --fail-threshold 1
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}