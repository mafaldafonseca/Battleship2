
name: Qodana Long Method - 123171

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Qodana Scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/data/project" \
            -v "${{ runner.temp }}/qodana-results:/data/results" \
            jetbrains/qodana-jvm-community:2026.2 \
            --config qodana-123171.yaml
