# 123171 - Inês Fidalgo
name: Qodana Code Analysis 123171

on:
  push:
    branches: [ "main", "develop", "teste-smell-123171" ]
  pull_request:
    branches: [ "main" ]

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Create Qodana Config
        run: |
          cat <<EOF > qodana-123171.yaml
          version: "1.0"
          linter: jetbrains/qodana-jvm-community:2025.3
          projectJDK: "21"
          profile:
            path: qodana/profiles/profile-123171.yaml
          failureConditions:
            severityThresholds:
              any: 0
          EOF

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2025.3
        with:
          args: --config qodana-123171.yaml --fail-threshold 1
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}